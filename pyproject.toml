[project]
name = "dialectic"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "extty>=0.27.0",
    "jaxtyping>=0.3.3",
    "python-dotenv>=1.2.1",
    "requests>=2.31.0",
    "safetensors>=0.7.0",
    "tokenizers>=0.22.1",
    "torch>=2.9.1",
    "tqdm>=4.67.1",
]

[dependency-groups]
dev = [
    "jinja2>=3.1.6",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "transformers>=4.57.3",
]
modal = ["modal>=1.3.0.post1"]
vllm = ["vllm>=0.9.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff.lint]
ignore = ["F722", "E741"]
extend-select = ["I"]

[[tool.uv.index]]
url = "https://pypi.pols.ai/"
